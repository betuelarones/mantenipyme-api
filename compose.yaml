services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mantenipyme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mantenipyme_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mantenipyme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mantenipyme} -d ${POSTGRES_DB:-mantenipyme}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

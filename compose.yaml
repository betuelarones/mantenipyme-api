name: mantenipyme

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mantenipyme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mantenipyme_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mantenipyme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mantenipyme} -d ${POSTGRES_DB:-mantenipyme}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mantenipyme}:${POSTGRES_PASSWORD:-mantenipyme_dev}@db:5432/${POSTGRES_DB:-mantenipyme}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: 3000
    command: sh -c "npx prisma db push && npm run db:seed && npm run start:prod"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
